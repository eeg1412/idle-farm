fish"],"inputs":[["IF10","6"],["IL06","5"],["I78","5"],["I64","5"],["I01","5"],["IL03","5"],["IF08","3"],["I76","3"]],"stage":4,"output":"1","seconds":1205,"price":"1692636","level":21},{"id":"PT36","name":"真鲷鹅蛋炙茄番茄咸塔礼盒","kind":"product","sectors":["agriculture","livestock","fish"],"inputs":[["IF08","7"],["IL05","5"],["I75","5"],["I57","5"],["I01","5"],["IL04","5"],["IF05","5"],["I76","4"]],"stage":4,"output":"1","seconds":1240,"price":"1041553","level":24},{"id":"PT37","name":"双鱼鸭肉香柚酥皮礼盒","kind":"product","sectors":["agriculture","livestock","fish"],"inputs":[["IF10","7"],["IL09","5"],["IF08","5"],["I49","5"],["I01","5"],["IL01","5"],["I73","5"],["I84","4"]],"stage":4,"output":"1","seconds":1275,"price":"2198088","level":24},{"id":"PT38","name":"大菱鲆牛汁紫苏鱼冻礼盒","kind":"product","sectors":["agriculture","livestock","fish"],"inputs":[["IF09","7"],["IL10","6"],["I77","5"],["I66","5"],["IF05","5"],["I22","5"],["IL05","4"],["I68","4"]],"stage":4,"output":"1","seconds":1310,"price":"2645424","level":24},{"id":"PT39","name":"鳗泥奶酪芒果芝麻卷礼盒","kind":"product","sectors":["agriculture","livestock","fish"],"inputs":[["IF07","7"],["IL04","6"],["I87","5"],["I74","5"],["I23","5"],["IL02","5"],["I83","4"],["IF06","4"]],"stage":2,"output":"1","seconds":1345,"price":"1041553","level":24},{"id":"PT40","name":"鲟汤羊肉双椒封口御汤罐","kind":"product","sectors":["agriculture","livestock","fish"],"inputs":[["IF10","7"],["IL08","6"],["I71","5"],["I72","5"],["IF08","5"],["I22","5"],["IL05","4"],["I67","4"]],"stage":4,"output":"1","seconds":1380,"price":"2254758","level":24},{"id":"PT41","name":"南岛金冠菠萝银鲑乳酥礼盒","kind":"product","sectors":["agriculture","livestock","fish"],"inputs":[["IF06","6"],["IL02","6"],["I97","5"],["I80","5"],["I01","5"],["IL04","5"],["I83","5"],["IL01","4"],["IF08","4"]],"stage":4,"output":"1","seconds":1420,"price":"4014872","level":27},{"id":"PT42","name":"金煌芒果真鲷奶酪咸塔礼盒","kind":"product","sectors":["agriculture","livestock","fish"],"inputs":[["IF08","6"],["IL04","6"],["I88","5"],["I87 <script>
(() => {
  const rows = JSON.parse(document.querySelector('#items').textContent);
  const items = new Map(rows.map((item) => [item.id, item]));
  const sources = { agriculture: '农业', livestock: '畜牧', fish: '水产' };
  const rawLabels = { agriculture: '作物', livestock: '畜牧原料', fish: '水产原料' };
  const rawSources = { agriculture: '田地收获', livestock: '畜牧场', fish: '鱼池' };
  const productLabels = { 1: '单类商品', 2: '双类商品', 3: '三类商品' };
  const catalog = document.querySelector('#catalog');
  const input = document.querySelector('input');
  const filters = [...document.querySelectorAll('[data-kind]')];
  const sectorFilters = [...document.querySelectorAll('[data-sector]')];
  const complexity = document.querySelector('#complexity');
  const pageSize = 25;
  let kind = '';
  let sector = '';
  let page = 0;
  const observer = 'IntersectionObserver' in window ? new IntersectionObserver((entries) => {
    for (const { target, isIntersecting } of entries) {
      if (!isIntersecting) continue;
      target.src = target.dataset.src;
      observer.unobserve(target);
    }
  }, { rootMargin: '120px 0px' }) : null;

  function element(tag, text, className) {
    const node = document.createElement(tag);
    if (text) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function icon(item) {
    const slot = element('span', '', 'icon');
    const img = element('img');
    img.alt = '';
    img.width = 96;
    img.height = 96;
    img.decoding = 'async';
    img.dataset.src = './icons/' + item.id + '.webp?v=f72ab0881972';
    img.addEventListener('error', () => img.remove(), { once: true });
    slot.append(img);
    if (observer) observer.observe(img);
    else img.src = img.dataset.src;
    return slot;
  }

  function duration(seconds) {
    const minutes = Math.floor(seconds / 60);
    const remainder = seconds % 60;
    return minutes === 0 ? seconds + ' 秒' : minutes + ' 分钟' + (remainder ? ' ' + remainder + ' 秒' : '');
  }

  function card(item) {
    const article = element('article', '', 'card');
    article.id = item.id;
    article.tabIndex = -1;
    const identity = element('div', '', 'identity');
    const title = element('div');
    const isRaw = item.kind === 'raw';
    const isProduct = item.kind === 'product';
    const label = isRaw ? rawLabels[item.sectors[0]] :
      item.sectors.map((key) => sources[key]).join('＋') + ' · ' + (isProduct ? productLabels[item.sectors.length] : '中间产物');
    title.append(element('p', label, 'category'), element('h2', item.name));
    identity.append(icon(item), title);
    const recipe = element('div', '', 'recipe');
    if (isRaw) {
      const source = rawSources[item.sectors[0]] + (item.species ? ' · ' + item.species : '');
      recipe.append(element('strong', '获取方式'), element('p', source, 'batch'));
    } else {
      recipe.append(element('strong', '配方材料'));
      const list = element('ul');
      for (const [id, amount] of item.inputs) {
        const entry = element('li');
        const link = element('a', items.get(id).name);
        link.href = '#' + id;
        entry.append(link, document.createTextNode(' × ' + amount));
        list.append(entry);
      }
      recipe.append(list);
      if (isProduct) {
        const total = item.inputs.reduce((sum, [, amount]) => sum + BigInt(amount), 0n);
        recipe.append(element('p', item.inputs.length + ' 种中间产物 · 共 ' + total + ' 件', 'batch'));
        recipe.append(element('p', '商品等级 ' + item.level, 'batch'));
      }
    }
    recipe.append(element('p', (isRaw ? '基础收成 ' + item.output + ' 份' : '每批产出 ' + item.output + ' 件') + ' · ' + duration(item.seconds), 'batch'));
    if (item.stage > 1) recipe.append(element('p', '最长生产链 ' + item.stage + ' 道工序', 'batch'));
    recipe.append(element('p', '基准单价 ' + BigInt(item.price).toLocaleString('zh-CN') + ' 金币', 'batch'));
    article.append(identity, recipe);
    return article;
  }

  function render() {
    observer?.disconnect();
    const query = input.value.trim().normalize('NFKC');
    const results = rows.filter((item) => (!kind || item.kind === kind) &&
      (!sector || item.sectors.includes(sector)) &&
      (!complexity.value || item.sectors.length === Number(complexity.value)) &&
      (!query || item.name.includes(query) || item.species?.includes(query) || item.inputs.some(([id]) => items.get(id).name.includes(query))));
    if (kind === 'product') results.sort((a, b) => a.level - b.level);
    const count = Math.ceil(results.length / pageSize);
    page = Math.min(page, Math.max(0, count - 1));
    catalog.replaceChildren(...results.slice(page * pageSize, (page + 1) * pageSize).map(card));
    document.querySelector('#empty').hidden = results.length > 0;
    document.querySelector('#count').textContent = results.length + ' 个品项';
    for (const filter of filters) filter.setAttribute('aria-pressed', String(filter.dataset.kind === kind));
    for (const filter of sectorFilters) filter.setAttribute('aria-pressed', String(filter.dataset.sector === sector));
    complexity.parentElement.hidden = kind !== 'product';
    for (const nav of document.querySelectorAll('.pager')) {
      const previous = element('button', '上一页');
      const next = element('button', '下一页');
      previous.disabled = page === 0;
      next.disabled = page + 1 >= count;
      previous.onclick = () => turn(-1);
      next.onclick = () => turn(1);
      nav.hidden = count < 2;
      nav.replaceChildren(previous, element('p', (page + 1) + ' / ' + count), next);
    }
  }

  function clearHash() {
    if (location.hash) history.replaceState(null, '', location.href.split('#')[0]);
  }

  function turn(step) {
    clearHash();
    page += step;
    render();
    catalog.scrollIntoView({ block: 'start' });
  }

  function openLinkedItem() {
    const id = location.hash.slice(1);
    const index = rows.findIndex((item) => item.id === id);
    if (index < 0) return;
    input.value = '';
    kind = '';
    sector = '';
    complexity.value = '';
    page = Math.floor(index / pageSize);
    render();
    const item = document.getElementById(id);
    item?.scrollIntoView({ block: 'center' });
    item?.focus({ preventScroll: true });
  }

  for (const filter of filters) filter.onclick = () => {
    clearHash();
    kind = filter.dataset.kind;
    if (kind !== 'product') complexity.value = '';
    page = 0;
    render();
  };
  for (const filter of sectorFilters) filter.onclick = () => { clearHash(); sector = filter.dataset.sector; page = 0; render(); };
  complexity.onchange = () => { clearHash(); page = 0; render(); };
  input.oninput = () => { clearHash(); page = 0; render(); };
  window.addEventListener('hashchange', openLinkedItem);
  render();
  openLinkedItem();
})();
</script>
